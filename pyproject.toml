[project]
name = "northwind-drift"
version = "0.1.0"
description = "Synthetic Northwind Health world (fictional) for a CMDB drift agent on FalkorDB"
requires-python = "==3.11.*"
dependencies = [
    "falkordb==1.7.1",
    "anthropic==1.13.0",
    "langgraph==1.2.14",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["falkordb: needs a running FalkorDB (docker compose up -d)"]

[tool.uv]
package = false
