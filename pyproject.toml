[project]
name = "northwind-drift"
version = "0.1.0"
description = "Synthetic Northwind Health world (fictional) for a CMDB drift agent on FalkorDB"
requires-python = ">=3.11,<3.13"  # 3.11 locally and in Docker; Vercel runs 3.12
dependencies = [
    "falkordb==1.7.1",
    "anthropic==1.13.0",
    "langgraph==1.2.14",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[dependency-groups]
bench = [
    "falkordb-bulk-loader>=1.2.0",
    "matplotlib>=3.11.2",
    "psycopg[binary]>=3.3.6",
]
dev = ["pytest==9.1.1", "httpx==0.28.1", "prometheus-client==0.26.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["falkordb: needs a running FalkorDB (docker compose up -d)"]

[tool.uv]
package = false
