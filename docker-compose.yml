# `docker compose up`: FalkorDB, a one-shot seed (generate seed-42 data + load), then API + UI on :8000.
# Works without an API key; put ANTHROPIC_API_KEY in .env for the live agent.
services:
  falkordb:
    image: falkordb/falkordb:v4.22.0
    environment:
      # default query timeout 10 s (agent tools pass 5 s per query); hard cap 60 s
      FALKORDB_ARGS: "TIMEOUT_MAX 60000 TIMEOUT_DEFAULT 10000 MAX_QUEUED_QUERIES 25"
    ports:
      - "6379:6379"   # Redis protocol / Cypher
      - "3000:3000"   # FalkorDB browser UI
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  seed:
    build: .
    command: >
      sh -c "python -m ingest.generate --seed 42 --out /app/data &&
             python -m ingest.load --data /app/data --graph northwind --fresh"
    environment:
      FALKORDB_HOST: falkordb
    volumes:
      - nw_data:/app/data
    depends_on:
      falkordb:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      # the local stack always uses the bundled FalkorDB, whatever .env holds for a cloud deployment
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_USERNAME: ""
      FALKORDB_PASSWORD: ""
      FALKORDB_TLS: "false"
      DEPLOY_MODE: local
      NORTHWIND_DATA: /app/data
      NORTHWIND_RUNTIME: /app/runtime
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - nw_data:/app/data
      - nw_runtime:/app/runtime
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  falkordb_data:
  nw_data:
  nw_runtime:
